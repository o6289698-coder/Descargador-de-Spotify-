<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador MP3 & MP4 - Deyra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b111e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #131b2e; border: 1px solid #1e293b; border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 14px; background-color: #0b111e; border: 1px solid #1e293b; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 15px; }
        input[type="text"]::placeholder { color: #64748b; }
        button.process-btn { width: 100%; padding: 14px; background-color: #0284c7; border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        button.process-btn:hover { background-color: #0369a1; }
        #results-container { text-align: left; margin-top: 15px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        #results-container::-webkit-scrollbar { width: 6px; }
        #results-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .song-item { background: #0b111e; border: 1px solid #1e293b; padding: 12px; margin-bottom: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .song-info { display: flex; justify-content: space-between; align-items: center; }
        .song-title { color: #38bdf8; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .btn-group { display: flex; gap: 6px; }
        .download-btn-mp3 { background-color: #16a34a; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.75rem; text-decoration: none; }
        .download-btn-mp3:hover { background-color: #15803d; }
        .download-btn-mp4 { background-color: #9333ea; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.75rem; text-decoration: none; }
        .download-btn-mp4:hover { background-color: #7e22ce; }
        .divider { height: 1px; background-color: #1e293b; margin: 20px 0; }
        .heart-btn { background: none; border: none; font-size: 2.2rem; cursor: pointer; transition: transform 0.2s; }
        .heart-btn:active { transform: scale(1.2); }
        #love-message { margin-top: 8px; color: #f43f5e; font-weight: 600; font-size: 1.1rem; min-height: 24px; }
        .footer { color: #64748b; font-size: 0.85rem; margin-top: 15px; }
        .footer span { color: #38bdf8; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Descargador YouTube MP3 & MP4</h1>
        <input type="text" id="song-input" placeholder="Escribe el nombre o pega el link...">
        <button class="process-btn" onclick="buscarMusica()">Buscar Opciones</button>
        
        <div id="results-container"></div>

        <div class="divider"></div>
        <button class="heart-btn" onclick="document.getElementById('love-message').textContent = 'Te amo Deyra'" title="Presiona">❤️</button>
        <div id="love-message"></div>
        <div class="footer">Desarrollado por <span>Erick</span></div>
    </div>

    <script>
        async function buscarMusica() {
            const query = document.getElementById('song-input').value.trim();
            const container = document.getElementById('results-container');
            if (!query) {
                alert("Por favor escribe algo para buscar.");
                return;
            }
            
            container.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:10px;">Buscando en YouTube... 🔍</div>';
            
            const formData = new FormData();
            formData.append('query', query);

            try {
                const res = await fetch('/search', { method: 'POST', body: formData });
                const data = await res.json();

                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:10px;">No se encontraron resultados.</div>';
                    return;
                }

                data.forEach(item => {
                    const songDiv = document.createElement('div');
                    songDiv.className = 'song-item';
                    songDiv.innerHTML = `
                        <div class="song-info">
                            <span class="song-title" title="${item.title}">${item.title}</span>
                            <div class="btn-group">
                                <form action="/download" method="POST" target="_blank" style="margin:0;">
                                    <input type="hidden" name="url" value="${item.url}">
                                    <input type="hidden" name="format" value="mp3">
                                    <button type="submit" class="download-btn-mp3">MP3</button>
                                </form>
                                <form action="/download" method="POST" target="_blank" style="margin:0;">
                                    <input type="hidden" name="url" value="${item.url}">
                                    <input type="hidden" name="format" value="mp4">
                                    <button type="submit" class="download-btn-mp4">MP4</button>
                                </form>
                            </div>
                        </div>
                    `;
                    container.appendChild(songDiv);
                });
            } catch (err) {
                container.innerHTML = '<div style="color:#f43f5e; text-align:center; padding:10px;">Error al conectar con el servidor.</div>';
            }
        }
    </script>
</body>
</html>

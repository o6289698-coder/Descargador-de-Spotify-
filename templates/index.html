<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Música Completa - Deyra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b111e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #131b2e; border: 1px solid #1e293b; border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 460px; text-align: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 14px; background-color: #0b111e; border: 1px solid #1e293b; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 15px; }
        input[type="text"]::placeholder { color: #64748b; }
        button.process-btn { width: 100%; padding: 14px; background-color: #0284c7; border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        button.process-btn:hover { background-color: #0369a1; }
        #results-container { text-align: left; margin-top: 15px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        #results-container::-webkit-scrollbar { width: 6px; }
        #results-container::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .song-item { background: #0b111e; border: 1px solid #1e293b; padding: 12px; margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .song-title { color: #38bdf8; font-size: 0.85rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; max-width: 250px; }
        .get-full-btn { background-color: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.8rem; white-space: nowrap; transition: background 0.2s; }
        .get-full-btn:hover { background-color: #15803d; }
        .divider { height: 1px; background-color: #1e293b; margin: 20px 0; }
        .heart-btn { background: none; border: none; font-size: 2.2rem; cursor: pointer; transition: transform 0.2s; }
        .heart-btn:active { transform: scale(1.2); }
        #love-message { margin-top: 8px; color: #f43f5e; font-weight: 600; font-size: 1.1rem; min-height: 24px; }
        .footer { color: #64748b; font-size: 0.85rem; margin-top: 15px; }
        .footer span { color: #38bdf8; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Descargador Canción Completa</h1>
        <input type="text" id="song-input" placeholder="Ej. La Banda del Recodo...">
        <button class="process-btn" onclick="buscarMusica()">Buscar Ampliamente</button>
        
        <div id="results-container"></div>

        <div class="divider"></div>
        <button class="heart-btn" onclick="document.getElementById('love-message').textContent = 'Te amo Deyra'" title="Presiona">❤️</button>
        <div id="love-message"></div>
        <div class="footer">Desarrollado por <span>Erick</span></div>
    </div>

    <script>
        async function buscarMusica() {
            const query = document.getElementById('song-input').value.trim();
            const container = document.getElementById('results-container');
            if (!query) {
                alert("Por favor escribe el nombre de la canción o artista.");
                return;
            }
            
            container.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:10px;">Buscando opciones completas... 🔍</div>';
            
            const formData = new FormData();
            formData.append('query', query);

            try {
                const res = await fetch('/search', { method: 'POST', body: formData });
                const data = await res.json();

                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:10px;">No se encontraron resultados.</div>';
                    return;
                }

                data.forEach(song => {
                    // Enlace inteligente optimizado para abrir la pista completa en buscadores de descarga directa
                    const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song.query_term)}`;
                    
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `
                        <span class="song-title" title="${song.title}">${song.title}</span>
                        <a href="${searchUrl}" target="_blank" class="get-full-btn">Obtener Completa</a>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = '<div style="color:#f43f5e; text-align:center; padding:10px;">Error al conectar con el servidor.</div>';
            }
        }
    </script>
</body>
</html>

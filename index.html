<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Video y Audio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1329;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #121c38;
            border: 1px solid #1e2d5c;
            border-radius: 16px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .input-url {
            width: 100%;
            background-color: #0b1329;
            border: 1px solid #1e2d5c;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .input-url::placeholder {
            color: #64748b;
        }

        .controls-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .select-format {
            flex: 1;
            background-color: #0b1329;
            border: 1px solid #1e2d5c;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .btn-process {
            background-color: #0284c7;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: #0369a1;
        }

        .btn-process:disabled {
            background-color: #03486b;
            cursor: not-allowed;
        }

        .heart {
            font-size: 24px;
            color: #ef4444;
            margin: 15px 0;
        }

        .divider {
            border: none;
            border-top: 1px solid #1e2d5c;
            margin: 15px 0;
        }

        .footer-text {
            color: #64748b;
            font-size: 13px;
        }

        .footer-text span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Descargador de<br>Video y Audio</h1>
        
        <input type="text" class="input-url" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">

        <div class="controls-container">
            <select class="select-format" id="formatSelect">
                <option value="mp4">Video MP4</option>
                <option value="mp3">Audio MP3</option>
            </select>
            <button class="btn-process" id="processBtn">Procesar</button>
        </div>

        <div class="heart">❤️</div>

        <hr class="divider">

        <div class="footer-text">
            Desarrollado por <span>Erick</span>
        </div>
    </div>

    <script>
        const processBtn = document.getElementById('processBtn');
        const urlInput = document.getElementById('urlInput');
        const formatSelect = document.getElementById('formatSelect');

        processBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            const format = formatSelect.value;

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert('Por favor, ingresa un enlace válido de YouTube.');
                return;
            }

            processBtn.textContent = 'Procesando...';
            processBtn.disabled = true;

            window.location.href = `/download?url=${encodeURIComponent(url)}&format=${format}`;

            setTimeout(() => {
                processBtn.textContent = 'Procesar';
                processBtn.disabled = false;
            }, 4000);
        });
    </script>

</body>
</html>

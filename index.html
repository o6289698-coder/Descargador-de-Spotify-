<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Multimedia - Te amo Deyra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4757;
            font-size: 24px;
        }
        p.love-msg {
            color: #ff6b81;
            font-style: italic;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2f3640;
            color: #fff;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #ff4757;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #ff6b81;
        }
        .preview-container {
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 315px;
            border-radius: 5px;
            border: none;
        }
        .loader {
            display: none;
            margin-top: 15px;
            color: #ffa502;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descargador de YouTube</h1>
        <p class="love-msg">Te amo Deyra ❤️</p>

        <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí...">
        <br>
        <button onclick="previewVideo()">Previsualizar</button>
        <br><br>

        <button onclick="startDownload('mp4')">Descargar Video (MP4)</button>
        <button onclick="startDownload('mp3')">Descargar Audio (MP3)</button>

        <div class="loader" id="loaderText">Procesando archivo en el servidor, espera un momento...</div>

        <div class="preview-container" id="previewArea"></div>
    </div>

    <script>
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function previewVideo() {
            const url = document.getElementById('urlInput').value;
            const videoId = extractVideoID(url);
            const previewArea = document.getElementById('previewArea');

            if (videoId) {
                previewArea.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
            } else {
                alert('Por favor ingresa un enlace de YouTube válido.');
            }
        }

        function startDownload(format) {
            const url = document.getElementById('urlInput').value;
            const loader = document.getElementById('loaderText');

            if (!url) {
                alert('Por favor ingresa un enlace primero.');
                return;
            }

            loader.style.display = 'block';
            window.location.href = `/download?url=${encodeURIComponent(url)}&format=${format}`;

            setTimeout(() => {
                loader.style.display = 'none';
            }, 6000);
        }
    </script>

</body>
</html>
